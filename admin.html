
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MM Trackers Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  color:#222;
}
.container{
  width:92%;
  max-width:420px;
  margin:90px auto;
  background:white;
  padding:30px;
  border-radius:12px;
  box-shadow:0 4px 20px #0001;
}
h2{text-align:center;margin-top:0}
input,button{
  width:100%;
  padding:13px;
  margin-top:14px;
  border-radius:6px;
  font-size:16px;
}
input{border:1px solid #ccc}
button{
  border:0;
  background:#087b43;
  color:white;
  cursor:pointer;
  font-weight:bold;
}
button:disabled{opacity:.6}
#message{
  margin-top:15px;
  text-align:center;
  font-size:14px;
  overflow-wrap:anywhere;
}
#dashboard{display:none}
</style>
</head>
<body>

<div class="container" id="login">
  <h2>MM Trackers Admin</h2>
  <p style="text-align:center">Secure Administrator Login</p>

  <form id="loginForm">
    <input type="email" id="email"
      placeholder="Admin Email" required>
    <input type="password" id="password"
      placeholder="Password" required>
    <button type="submit" id="loginBtn">Login</button>
  </form>

  <div id="message"></div>
</div>

<div class="container" id="dashboard">
  <h2>Admin Access Verified</h2>
  <p>You are successfully logged in as an MM Trackers administrator.</p>
  <p id="adminEmail"></p>
  <button id="logoutBtn">Logout</button>
</div>

<script>
const SUPABASE_URL =
  "https://lzfuqivdkcjxgclitrnk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dwwSB3mnKbLEgmasodNBkw_Z0-e4RM5";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
const loginBox = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");

async function verifyAdmin() {
  const { data: { session }, error } =
    await db.auth.getSession();

  if (error || !session) {
    showLogin();
    return;
  }

  const { data, error: adminError } =
    await db.rpc("is_mm_admin");

  if (adminError || data !== true) {
    await db.auth.signOut();
    showLogin();
    message.textContent =
      "Access denied. Administrator account required.";
    return;
  }

  loginBox.style.display = "none";
  dashboard.style.display = "block";
  document.getElementById("adminEmail").textContent =
    session.user.email;
}

function showLogin() {
  loginBox.style.display = "block";
  dashboard.style.display = "none";
}

document.getElementById("loginForm")
.addEventListener("submit", async function(e) {
  e.preventDefault();

  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.textContent = "Checking...";
  message.textContent = "";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.textContent = error.message;
    btn.disabled = false;
    btn.textContent = "Login";
    return;
  }

  await verifyAdmin();

  btn.disabled = false;
  btn.textContent = "Login";
});

document.getElementById("logoutBtn")
.addEventListener("click", async function() {
  await db.auth.signOut();
  showLogin();
  message.textContent = "You have logged out.";
});

verifyAdmin();
</script>

</body>
</html>
